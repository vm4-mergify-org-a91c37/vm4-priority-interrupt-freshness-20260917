merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: true
    merge_conditions:
      - check-success = vm4-priority-stable
      - check-success = vm4-priority-fresh
priority_rules:
  - name: urgent interruptor
    conditions:
      - label = vm4-high
    priority: high
    allow_checks_interruption: true
  - name: normal victim
    conditions:
      - label = vm4-low
    priority: low
