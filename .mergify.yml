merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 10
    batch_max_wait_time: 1 min
    queue_conditions: true
    merge_conditions:
      - check-success = vm4-checked-car-gate
priority_rules:
  - name: urgent checked-car interrupter
    conditions:
      - title = VM4 CHECKED CAR URGENT 20260929
    priority: high
    allow_checks_interruption: true
  - name: normal checked-car batch
    conditions:
      - title != VM4 CHECKED CAR URGENT 20260929
    priority: low
